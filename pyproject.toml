[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-bot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "neonize",
    "yt-dlp",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
yt-bot = "yt_bot.bot:main"
